chapter-1-subchapter-41.txt:
  '[44]':
    lat:
      text: '44 Deinde aggrega illam aquam totam, et proiice eam super aliam calcem:
        et cola, donec renouetur.'
      note: '"donec renovetur" scheint ein Übersetzungsfehler zu sein - "upon a fresh
        lot"?'
chapter-1-subchapter-42.txt:
  '[3]':
    lat:
      text: '3 Oportet ergo post euacuationem infirmi cum pillulis foetidis, et eis
        similibus, ut fiant super Dorsum, ubi est dolor, tres lineae secundum latitudinem
        almeidati ipsius, postquam signas cum encaustro in omni linea quinque cauteria,
        aut plura secundum quantitatem quae uenit ex tolerantia infirmi uirtute eius:
        et fiat cauterizatio cum cauteriopuncti.'
      note: cauteriopuncti wohl ein OCR-Fehler
chapter-1-subchapter-56.txt:
  '[19]':
    lat:
      text: 19 ¶ Partis Primae Finis.
      note: Bis zum Ende dieses Abschnitts durchgesehen und korrigiert.
