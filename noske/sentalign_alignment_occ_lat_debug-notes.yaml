chapter-1.txt:
  '[6,7]':
    lat:
      text: '6 Dico ergo, quod sermo de qualitate iuuamenti Cauterii, et nocumenti
        eius, est sermo prolixus, et subtilis, scientia, et secretum occultum. 7 Etiam
        locuta fuit in eo multitudo sapientum, et dissenserunt in eo: et mihi quidem
        sufficit parum ex sermonibus eorum, timens prolongationem.'
      note: ch 1 lat 6,7
